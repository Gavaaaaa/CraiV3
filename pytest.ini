[pytest]
# B4-b (Etapa 1): cala o PytestDeprecationWarning do pytest-asyncio sobre o
# escopo padrão do loop das fixtures assíncronas, fixando o valor que a
# suíte já usa de fato (nenhuma fixture assíncrona pede outro escopo).
# Nada mais é configurado aqui: `python_files`, `rootdir` e a coleta
# continuam nos defaults, e os dois conftest (raiz e app/tests) seguem
# valendo como antes.
asyncio_default_fixture_loop_scope = function
